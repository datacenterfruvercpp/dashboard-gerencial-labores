---
deployment:
  tasks:
    - export DEPLOYPATH=/home/datacent/respaldoreportedelabores.datacenterpc.com
    # Servidor estatico ultraligero (sustituye Next.js standalone)
    - /bin/cp -f start-server.js $DEPLOYPATH/start-server.js
    - /bin/cp -f package.json $DEPLOYPATH/package.json
    # Archivos del build estatico (out/) directamente al doc root
    - /bin/cp -f out/index.html $DEPLOYPATH/index.html
    - /bin/cp -f out/404.html $DEPLOYPATH/404.html
    - /bin/cp -f out/data.json $DEPLOYPATH/data.json
    - /bin/cp -f out/planillas-data.json $DEPLOYPATH/planillas-data.json
    - /bin/cp -f out/favicon.ico $DEPLOYPATH/favicon.ico
    - /bin/cp -f out/og-image.png $DEPLOYPATH/og-image.png
    - /bin/cp -rf out/_next $DEPLOYPATH/_next
    # NO copiamos el .htaccess para no romper la config de Passenger
